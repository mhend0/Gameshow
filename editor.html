<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editor · Game Show Studio</title>
<link rel="stylesheet" href="platform/ui/theme.css" />
<style>
  body { overflow-x: hidden; }
  .ed-top { display:flex; align-items:center; gap:14px; padding:12px 20px;
    background:color-mix(in srgb,var(--bg-0) 82%,transparent); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft); position:sticky; top:0; z-index:30; }
  .ed-top .spacer { flex:1; }
  .board-name { font-size:19px; font-weight:800; letter-spacing:-.01em; background:transparent; border:1px solid transparent;
    color:var(--text-0); padding:6px 10px; border-radius:10px; min-width:200px; }
  .board-name:hover { background:var(--bg-2); }
  .board-name:focus { outline:none; background:var(--bg-1); border-color:var(--line); }
  .save-badge { font-size:12.5px; font-weight:600; color:var(--text-2); display:flex; align-items:center; gap:6px; }
  .save-badge .dot { width:7px;height:7px;border-radius:50%;background:var(--good); }
  .save-badge.saving .dot { background:var(--warn); }

  .ed-body { padding:22px 20px 120px; }
  .ed-structure { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .ed-structure .muted { font-size:13px; }

  /* board grid (editable) */
  .ed-board { display:grid; gap:10px; align-items:start; overflow-x:auto; padding-bottom:8px; }
  .ed-col { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .cat-head { position:relative; }
  .cat-input { width:100%; text-align:center; font-weight:800; text-transform:uppercase; letter-spacing:.02em;
    color:#fff; background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
    border:1px solid transparent; border-radius:10px; padding:12px 8px; font-size:13px; line-height:1.2; min-height:56px; resize:none; }
  .cat-input:focus { outline:none; box-shadow:var(--ring); }
  .cat-remove { position:absolute; top:-8px; right:-8px; width:22px;height:22px;border-radius:50%; border:1px solid var(--line);
    background:var(--bg-3); color:var(--text-1); font-size:12px; cursor:pointer; display:none; align-items:center; justify-content:center; }
  .ed-col:hover .cat-remove { display:flex; }

  .clue-tile { position:relative; min-height:66px; border-radius:10px; cursor:pointer; padding:8px 10px;
    background:linear-gradient(180deg,var(--bg-3),var(--bg-2)); border:1px solid var(--line-soft);
    display:flex; flex-direction:column; gap:4px; transition:all .16s var(--ease); }
  .clue-tile:hover { border-color:color-mix(in srgb,var(--accent) 55%,var(--line)); transform:translateY(-2px); box-shadow:var(--shadow-2); }
  .clue-tile.selected { border-color:var(--accent); box-shadow:var(--ring); }
  .clue-tile .val { font-weight:800; color:var(--gold); font-size:18px; }
  .clue-tile .snippet { font-size:11.5px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .clue-tile .marks { position:absolute; top:7px; right:8px; display:flex; gap:4px; font-size:12px; }
  .clue-tile.empty .val { color:var(--text-2); }
  .clue-tile.dd { outline:1.5px solid var(--gold); outline-offset:-1.5px; }

  /* inspector drawer */
  .drawer-scrim { position:fixed; inset:0; background:color-mix(in srgb,#000 45%,transparent); opacity:0; pointer-events:none;
    transition:opacity .2s var(--ease); z-index:40; }
  .drawer-scrim.show { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100vh; width:min(460px,100%); z-index:50; transform:translateX(100%);
    transition:transform .26s var(--ease); background:linear-gradient(180deg,var(--bg-1),var(--bg-0));
    border-left:1px solid var(--line); box-shadow:var(--shadow-3); display:flex; flex-direction:column; }
  .drawer.show { transform:none; }
  .drawer-head { display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line-soft); }
  .drawer-head h3 { font-size:16px; }
  .drawer-body { padding:18px; overflow:auto; display:flex; flex-direction:column; gap:18px; }
  .drawer-foot { margin-top:auto; padding:14px 18px; border-top:1px solid var(--line-soft); display:flex; gap:10px; }

  .insp-field { display:flex; flex-direction:column; gap:8px; }
  .insp-field > label { font-size:12.5px; font-weight:700; color:var(--text-1); letter-spacing:.01em; text-transform:uppercase; }
  .insp-field textarea { min-height:74px; resize:vertical; line-height:1.45; }
  .row { display:flex; gap:12px; }
  .row > * { flex:1; }

  .dropzone { border:1.5px dashed var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px;
    transition:all .18s var(--ease); }
  .dropzone.over { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent); }
  .dz-hint { font-size:12px; color:var(--text-2); text-align:center; padding:6px; cursor:pointer; }
  .dz-hint b { color:var(--accent); }
  .media-list { display:flex; flex-wrap:wrap; gap:8px; }
  .media-thumb { position:relative; width:72px; height:72px; border-radius:9px; overflow:hidden; border:1px solid var(--line); background:var(--bg-2); display:grid; place-items:center; }
  .media-thumb img { width:100%; height:100%; object-fit:cover; }
  .media-thumb .kind { font-size:22px; }
  .media-thumb .rm { position:absolute; top:2px; right:2px; width:18px;height:18px;border-radius:50%; background:rgba(0,0,0,.7); color:#fff; border:none; font-size:11px; cursor:pointer; }
  .ext-badge { position:absolute; bottom:2px; left:2px; font-size:8px; font-weight:700; background:var(--warn); color:#000; padding:1px 4px; border-radius:4px; }

  .toggle { display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--line); border-radius:12px; cursor:pointer; user-select:none; }
  .toggle .sw { width:38px; height:22px; border-radius:999px; background:var(--bg-3); position:relative; transition:background .2s; flex:none; }
  .toggle .sw::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s var(--ease); }
  .toggle.on .sw { background:var(--gold); }
  .toggle.on .sw::after { transform:translateX(16px); }
  .toggle .lbl { font-weight:600; font-size:14px; }
  .toggle .lbl small { display:block; color:var(--text-2); font-weight:500; font-size:12px; }

  .gsp-rich-media { max-width:100%; border-radius:8px; margin-top:6px; }
</style>
</head>
<body>
  <div class="ed-top">
    <a class="btn ghost sm" href="boards.html">‹ Boards</a>
    <input class="board-name" id="boardName" />
    <span class="save-badge" id="saveBadge"><span class="dot"></span><span id="saveText">Saved</span></span>
    <span class="spacer"></span>
    <span class="muted" id="storageInfo" title="Media storage used by all your boards"></span>
    <button class="btn sm" id="shrinkBtn" title="Resize stored photos to free up space">🗜 Free up space</button>
    <button class="btn sm" id="settingsBtn">⚙ Board settings</button>
    <button class="btn sm" id="previewBtn">👁 Preview</button>
    <button class="btn primary sm" id="playBtn">▶ Play</button>
  </div>

  <main class="ed-body">
    <div class="ed-structure">
      <button class="btn sm" id="addCat">＋ Category</button>
      <button class="btn sm" id="addRow">＋ Row</button>
      <button class="btn sm ghost" id="removeRow">－ Row</button>
      <span class="muted" id="structInfo"></span>
    </div>
    <div class="ed-board" id="board"></div>
  </main>

  <div class="drawer-scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { BoardRepo } from "./platform/core/repos.js";
    import { makeClue, makeCategory, richIsEmpty } from "./platform/core/models.js";
    import { AssetService } from "./platform/core/assets.js";
    import { storageUsage } from "./platform/core/store.js";
    import { renderBoardGrid } from "./platform/ui/board-view.js";
    import { el, toast, modal, confirmDialog } from "./platform/ui/ui.js";

    const params = new URLSearchParams(location.search);
    const boardId = params.get("id");
    let board = boardId ? BoardRepo.get(boardId) : null;
    if (!board) { document.body.innerHTML = errorScreen(); throw new Error("Board not found"); }

    let selected = null; // {catIndex, row}
    const boardEl = document.getElementById("board");
    const nameEl = document.getElementById("boardName");

    /* ---------- persistence (debounced autosave) ---------- */
    let saveTimer;
    function markSaving() {
      const b = document.getElementById("saveBadge");
      b.classList.add("saving"); document.getElementById("saveText").textContent = "Saving…";
    }
    function commit(rerender = true) {
      markSaving();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        BoardRepo.save(board);
        const b = document.getElementById("saveBadge");
        b.classList.remove("saving"); document.getElementById("saveText").textContent = "Saved";
      }, 350);
      if (rerender) renderBoard();
    }

    /* ---------- helpers ---------- */
    const maxRows = () => board.categories.reduce((m, c) => Math.max(m, c.clues.length), 0);
    const rowValue = (r) => {
      // dominant value at row r, else laddered
      const vals = board.categories.map(c => c.clues[r]?.value).filter(Boolean);
      if (vals.length) return vals.sort((a,b)=>vals.filter(v=>v===a).length-vals.filter(v=>v===b).length).pop();
      return (r + 1) * 100;
    };

    /* ---------- board render ---------- */
    function renderBoard() {
      const rows = Math.max(maxRows(), 1);
      document.getElementById("structInfo").textContent =
        `${board.categories.length} categories · ${rows} rows · ${BoardRepo.clueCount(board)} clues`;
      boardEl.style.gridTemplateColumns = `repeat(${board.categories.length || 1}, minmax(150px, 1fr))`;
      boardEl.innerHTML = "";

      board.categories.forEach((cat, ci) => {
        const col = el("div", { class: "ed-col" });
        const head = el("div", { class: "cat-head" });
        const input = el("textarea", { class: "cat-input", rows: 2, value: cat.name });
        input.addEventListener("input", () => { cat.name = input.value; scheduleNameCommit(); });
        input.addEventListener("blur", () => commit(false));
        const rm = el("button", { class: "cat-remove", html: "✕", title: "Remove category",
          onClick: async () => { if (await confirmDialog({ title: "Remove category?", message: `“${cat.name}” and its ${cat.clues.length} clues will be removed.`, confirmText: "Remove", danger: true })) { board.categories.splice(ci, 1); commit(); } } });
        head.append(input, rm);
        col.appendChild(head);

        for (let r = 0; r < rows; r++) {
          let clue = cat.clues[r];
          if (!clue) { clue = makeClue({ value: rowValue(r) }); cat.clues[r] = clue; }
          const empty = richIsEmpty(clue.prompt) && richIsEmpty(clue.response);
          const isSel = selected && selected.catIndex === ci && selected.row === r;
          const tile = el("div", { class: `clue-tile ${empty ? "empty" : ""} ${clue.dailyDouble ? "dd" : ""} ${isSel ? "selected" : ""}` }, [
            el("span", { class: "val", text: String(clue.value) }),
            el("span", { class: "snippet", text: snippet(clue) }),
            el("span", { class: "marks", html: `${clue.dailyDouble ? "⭐" : ""}${hasMedia(clue) ? "🖼" : ""}` }),
          ]);
          tile.addEventListener("click", () => openInspector(ci, r));
          col.appendChild(tile);
        }
        boardEl.appendChild(col);
      });
    }

    const snippet = (clue) => (clue.prompt?.text || clue.response?.text || "").slice(0, 60);
    const hasMedia = (clue) => (clue.prompt?.media?.length || clue.response?.media?.length);

    let nameCommitTimer;
    function scheduleNameCommit() { clearTimeout(nameCommitTimer); nameCommitTimer = setTimeout(() => commit(false), 400); }

    /* ---------- inspector drawer ---------- */
    function openInspector(ci, r) {
      selected = { catIndex: ci, row: r };
      const cat = board.categories[ci];
      const clue = cat.clues[r];
      const drawer = document.getElementById("drawer");

      const valueInput = el("input", { class: "input", type: "number", value: clue.value, min: 0, step: 100 });
      valueInput.addEventListener("input", () => { clue.value = parseInt(valueInput.value, 10) || 0; commit(); });

      const ddToggle = el("div", { class: `toggle ${clue.dailyDouble ? "on" : ""}` }, [
        el("div", { class: "sw" }),
        el("div", { class: "lbl", html: "Daily Double<small>Wager round with a reveal animation</small>" }),
      ]);
      ddToggle.addEventListener("click", () => { clue.dailyDouble = !clue.dailyDouble; ddToggle.classList.toggle("on", clue.dailyDouble); commit(); });

      const diffSelect = el("select", { class: "input" },
        [["", "—"], [1, "★ Easy"], [2, "★★"], [3, "★★★ Medium"], [4, "★★★★"], [5, "★★★★★ Hard"]].map(([v, l]) =>
          el("option", { value: v, ...(String(clue.difficulty ?? "") === String(v) ? { selected: "" } : {}) }, [l])));
      diffSelect.addEventListener("change", () => { const v = diffSelect.value; if (v) clue.difficulty = Number(v); else delete clue.difficulty; commit(false); });

      const notesInput = el("textarea", { class: "input", placeholder: "Private host notes (never shown to the room)…", value: clue.notes || "" });
      notesInput.addEventListener("input", () => { clue.notes = notesInput.value; commit(false); });

      drawer.innerHTML = "";
      drawer.append(
        el("div", { class: "drawer-head" }, [
          el("h3", { text: `${cat.name || "Category"} · ${clue.value}` }),
          el("span", { class: "spacer", style: { flex: 1 } }),
          el("button", { class: "btn icon ghost", html: "✕", onClick: closeInspector }),
        ]),
        el("div", { class: "drawer-body" }, [
          field("Clue (shown to the room)", richEditor(clue, "prompt")),
          field("Correct response (revealed)", richEditor(clue, "response")),
          el("div", { class: "row" }, [ field("Value", valueInput), field("Difficulty", diffSelect) ]),
          ddToggle,
          field("Notes", notesInput),
        ]),
        el("div", { class: "drawer-foot" }, [
          el("button", { class: "btn danger sm", text: "Clear clue", onClick: () => { cat.clues[r] = makeClue({ value: clue.value }); commit(); openInspector(ci, r); } }),
          el("span", { style: { flex: 1 } }),
          el("button", { class: "btn sm", text: "Done", onClick: closeInspector }),
        ]),
      );
      drawer.classList.add("show");
      document.getElementById("scrim").classList.add("show");
      renderBoard();
    }

    function field(label, control) {
      return el("div", { class: "insp-field" }, [el("label", { text: label }), control]);
    }

    function closeInspector() {
      selected = null;
      document.getElementById("drawer").classList.remove("show");
      document.getElementById("scrim").classList.remove("show");
      renderBoard();
    }
    document.getElementById("scrim").addEventListener("click", closeInspector);

    /* ---------- rich content editor (text + media dropzone) ---------- */
    function richEditor(clue, key) {
      const rc = clue[key];
      const wrap = el("div", { class: "insp-field", style: { gap: "10px" } });

      const ta = el("textarea", { class: "input", value: rc.text || "", placeholder: key === "prompt" ? "The clue text…" : "The answer…" });
      ta.addEventListener("input", () => { rc.text = ta.value; commit(); });

      const mediaList = el("div", { class: "media-list" });
      const renderMedia = () => {
        mediaList.innerHTML = "";
        (rc.media || []).forEach((ref, i) => {
          const resolved = AssetService.resolve(ref);
          const thumb = el("div", { class: "media-thumb" });
          if (resolved && resolved.kind === "image") thumb.appendChild(el("img", { src: resolved.url, alt: resolved.alt }));
          else thumb.appendChild(el("span", { class: "kind", text: ref.kind === "audio" ? "🎵" : ref.kind === "video" ? "🎬" : "🖼" }));
          if (ref.src && !ref.assetId) thumb.appendChild(el("span", { class: "ext-badge", text: "EXT" }));
          thumb.appendChild(el("button", { class: "rm", html: "✕", title: "Remove", onClick: () => { rc.media.splice(i, 1); commit(); renderMedia(); } }));
          mediaList.appendChild(thumb);
        });
      };
      renderMedia();

      const fileInput = el("input", { type: "file", accept: "image/*,audio/*,video/*", multiple: true, style: { display: "none" } });
      fileInput.addEventListener("change", () => addFiles([...fileInput.files]));

      const dz = el("div", { class: "dropzone" }, [
        mediaList,
        el("div", { class: "dz-hint", html: "Drag media here or <b>browse</b>" }),
      ]);
      dz.querySelector(".dz-hint").addEventListener("click", () => fileInput.click());
      ["dragover", "dragenter"].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("over"); }));
      ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("over"); }));
      dz.addEventListener("drop", (e) => addFiles([...(e.dataTransfer?.files || [])]));

      async function addFiles(files) {
        const media = files.filter(f => /^(image|audio|video)\//.test(f.type));
        let added = 0, full = false;
        for (const f of media) {
          try {
            const ref = await AssetService.importFile(f);
            rc.media = rc.media || [];
            rc.media.push(ref);
            added++;
          } catch (e) {
            // Never fail silently — a dropped photo that just vanishes reads as
            // "the editor is broken".
            if (e && e.name === "StorageFullError") { full = true; break; }
            console.error(e);
            toast(`Couldn't add ${f.name || "that file"}: ${e && e.message ? e.message : e}`);
          }
        }
        if (added) { commit(); renderMedia(); }
        if (full) storageWasFull = true;
        updateStorageInfo();
        if (full) {
          toast(`Storage is full — ${added ? added + " added, " : ""}click “Free up space” to shrink stored photos`, 6000);
        } else if (added) {
          toast(`${added} file${added === 1 ? "" : "s"} added`);
        }
      }

      wrap.append(ta, dz, fileInput);
      return wrap;
    }

    /* ---------- media storage ----------
       Boards keep their media inside the browser's own storage, which is only a
       few MB. Show how full it is, and offer a one-click way to shrink what's
       already stored rather than making the host delete clues. */
    const fmtMB = (b) => (b / 1048576).toFixed(1) + " MB";
    // The browser never tells us its storage cap (it varies by browser and
    // profile), so don't guess a threshold — flag it red only once a save has
    // actually been refused.
    let storageWasFull = false;
    function updateStorageInfo() {
      const box = document.getElementById("storageInfo"); if (!box) return;
      box.textContent = `Media: ${fmtMB(storageUsage())}` + (storageWasFull ? " — FULL" : "");
      box.style.color = storageWasFull ? "#e8452b" : "";
      box.style.fontWeight = storageWasFull ? "700" : "";
    }
    document.getElementById("shrinkBtn").addEventListener("click", async () => {
      const btn = document.getElementById("shrinkBtn");
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = "Shrinking…";
      try {
        const r = await AssetService.recompressAll();
        const saved = Math.max(0, r.before - r.after);
        if (r.count) storageWasFull = false;          // there's room again
        toast(r.count
          ? `Shrank ${r.count} image${r.count === 1 ? "" : "s"} — freed ${fmtMB(saved)} (now ${fmtMB(r.after)})`
          : "Nothing left to shrink — images are already at their smallest", 5000);
      } catch (e) {
        console.error(e);
        toast("Couldn't shrink images: " + (e && e.message ? e.message : e), 5000);
      } finally {
        btn.disabled = false; btn.textContent = label;
        updateStorageInfo();
      }
    });
    updateStorageInfo();

    /* ---------- structure ops ---------- */
    document.getElementById("addCat").addEventListener("click", () => {
      const rows = Math.max(maxRows(), 5);
      const clues = Array.from({ length: rows }, (_, r) => makeClue({ value: rowValue(r) }));
      board.categories.push(makeCategory({ name: `Category ${board.categories.length + 1}`, clues }));
      commit();
    });
    document.getElementById("addRow").addEventListener("click", () => {
      const r = maxRows();
      const v = (r + 1) * (rowValue(0) || 100);
      board.categories.forEach(c => c.clues[r] = makeClue({ value: v }));
      commit();
    });
    document.getElementById("removeRow").addEventListener("click", async () => {
      const r = maxRows() - 1;
      if (r < 0) return;
      if (await confirmDialog({ title: "Remove last row?", message: "The bottom row of clues across all categories will be removed.", confirmText: "Remove", danger: true })) {
        board.categories.forEach(c => c.clues.splice(r, 1));
        commit();
      }
    });

    /* ---------- name, settings, preview ---------- */
    nameEl.value = board.name;
    nameEl.addEventListener("input", () => { board.name = nameEl.value; scheduleNameCommit(); });
    nameEl.addEventListener("blur", () => commit(false));

    document.getElementById("previewBtn").addEventListener("click", () => {
      const closeBtn = el("button", { class: "btn ghost", text: "Close" });
      const m = modal({ title: `Preview · ${board.name}`, wide: true, body: renderBoardGrid(board, { showDailyDouble: true }), actions: [closeBtn] });
      closeBtn.addEventListener("click", () => m.close());
    });

    document.getElementById("playBtn").addEventListener("click", () => {
      location.href = `index.html?screen=control&board=${board.id}`;
    });

    document.getElementById("settingsBtn").addEventListener("click", openSettings);
    function openSettings() {
      const tags = el("input", { class: "input", value: (board.meta.tags || []).join(", "), placeholder: "e.g. bible, movies, music" });
      const notes = el("textarea", { class: "input", value: board.meta.notes || "", placeholder: "Notes about this board…" });
      const diff = el("select", { class: "input" },
        [["", "—"], [1, "★ Easy"], [2, "★★"], [3, "★★★ Medium"], [4, "★★★★"], [5, "★★★★★ Hard"]].map(([v, l]) =>
          el("option", { value: v, ...(String(board.meta.difficulty ?? "") === String(v) ? { selected: "" } : {}) }, [l])));
      const fav = el("div", { class: `toggle ${board.meta.favourite ? "on" : ""}` }, [el("div", { class: "sw" }), el("div", { class: "lbl", text: "Favourite" })]);
      fav.addEventListener("click", () => { board.meta.favourite = !board.meta.favourite; fav.classList.toggle("on", board.meta.favourite); });

      const save = el("button", { class: "btn primary", text: "Save settings" });
      const m = modal({
        title: "Board settings",
        body: el("div", { style: { display: "flex", flexDirection: "column", gap: "16px" } }, [
          field("Tags (comma-separated)", tags), field("Difficulty", diff), field("Notes", notes), fav,
        ]),
        actions: [el("button", { class: "btn ghost", text: "Cancel", onClick: () => m.close() }), save],
      });
      save.addEventListener("click", () => {
        board.meta.tags = tags.value.split(",").map(s => s.trim()).filter(Boolean);
        board.meta.notes = notes.value;
        if (diff.value) board.meta.difficulty = Number(diff.value); else delete board.meta.difficulty;
        commit(false); m.close(); toast("Settings saved");
      });
    }

    function errorScreen() {
      return `<div style="max-width:520px;margin:16vh auto;text-align:center;font-family:var(--font);color:#fff">
        <div style="font-size:44px">🕳️</div><h1>Board not found</h1>
