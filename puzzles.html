<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Puzzles · Game Show Studio</title>
<link rel="stylesheet" href="platform/ui/theme.css" />
<style>
  /* Wheel pages run a green/gold accent so you always know which game you're in. */
  body { --accent:#18c29c; --accent-2:#3ad6b3; }

  .page-head { display:flex; align-items:flex-end; gap:16px; margin:28px 0 20px; flex-wrap:wrap; }
  .page-head h1 { font-size:30px; }
  .page-head .sub { color:var(--text-2); font-size:14px; margin-top:4px; }
</style>
</head>
<body>
  <div id="topbar"></div>
  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>🎡 Puzzles</h1>
        <div class="sub">Your Wheel of Fortune puzzle library</div>
      </div>
    </div>
    <div id="panel"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    // The page is deliberately thin: the library itself is a panel, so this URL
    // and the game's settings screen render exactly the same component.
    import { el, topbar } from "./platform/ui/ui.js";
    import { mountPuzzles } from "./platform/ui/panels/puzzles-panel.js";
    import { ensureWheelSeeded } from "./platform/core/wheel-seed.js";

    document.getElementById("topbar").replaceWith(
      topbar({ active: "Puzzles", links: [
        { href: "home.html", label: "Home" },
        { href: "puzzles.html", label: "Puzzles" },
        { href: "wheel-sessions.html", label: "Wheel Sessions" },
      ], right: [
        el("a", { class: "btn primary sm", href: "wheel.html?screen=control", text: "▶ Open Console" }),
      ]})
    );

    ensureWheelSeeded();
    mountPuzzles(document.getElementById("panel"));
  </script>
</body>
</html>
