<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Game Show Studio</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #07080d; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 420px; }
  .glyph {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
    background: linear-gradient(135deg, #3b6fff, #7a5cff);
    display: grid; place-items: center; font-size: 30px;
    box-shadow: 0 10px 24px -8px #3b6fff;
  }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #9aa3b8; font-size: 14.5px; line-height: 1.5; margin: 0 0 22px; }
  button {
    font: inherit; font-weight: 700; font-size: 14px; color: #fff; cursor: pointer;
    padding: 11px 20px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #3b6fff, #7a5cff);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
  }
  button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="card">
    <div class="glyph">🎬</div>
    <h1>You're offline</h1>
    <p>This page hasn't been opened before, so there's no offline copy of it yet. Reconnect and try again — pages you've already visited will keep working offline.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
