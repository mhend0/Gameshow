<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wheel Sessions · Game Show Studio</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#07080d" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Game Show" />
<meta name="mobile-web-app-capable" content="yes" />
<script src="platform/ui/pwa.js" defer></script>
<link rel="stylesheet" href="platform/ui/theme.css" />
<style>
  body { --accent:#18c29c; --accent-2:#3ad6b3; }

  .page-head { display:flex; align-items:flex-end; gap:16px; margin:28px 0 20px; flex-wrap:wrap; }
  .page-head h1 { font-size:30px; }
  .page-head .sub { color:var(--text-2); font-size:14px; margin-top:4px; }
</style>
</head>
<body>
  <div id="topbar"></div>
  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>🎡 Wheel Sessions</h1>
        <div class="sub">A running order of puzzles. Sessions reference the library, so one puzzle can play in many nights.</div>
      </div>
    </div>
    <div id="panel"></div>
  </main>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { el, topbar } from "./platform/ui/ui.js";
    import { mountWheelSessions } from "./platform/ui/panels/wheel-sessions-panel.js";
    import { ready } from "./platform/core/store.js";
    await ready;

    document.getElementById("topbar").replaceWith(
      topbar({ active: "Wheel Sessions", links: [
        { href: "home.html", label: "Home" },
        { href: "puzzles.html", label: "Puzzles" },
        { href: "wheel-sessions.html", label: "Wheel Sessions" },
      ], right: [
        el("a", { class: "btn primary sm", href: "wheel.html?screen=control", text: "▶ Open Console" }),
      ]})
    );

    mountWheelSessions(document.getElementById("panel"));
  </script>
</body>
</html>
