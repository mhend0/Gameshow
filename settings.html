<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings · Game Show Studio</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#07080d" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Game Show" />
<meta name="mobile-web-app-capable" content="yes" />
<script src="platform/ui/pwa.js" defer></script>
<link rel="stylesheet" href="platform/ui/theme.css" />
<style>
  .page-head { display:flex; align-items:center; gap:16px; margin:28px 0 20px; flex-wrap:wrap; }
  .sh-glyph { width:52px; height:52px; border-radius:15px; flex:none; display:grid; place-items:center; font-size:26px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.25); }
  .page-head h1 { font-size:26px; }
  .page-head .sub { color:var(--text-2); font-size:14px; margin-top:2px; }
  .page-head .spacer { flex:1; }

  .tabbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:26px;
    border-bottom:1px solid var(--line-soft); padding-bottom:14px; }
  .settings-tab { display:flex; align-items:center; gap:9px; padding:10px 16px; border-radius:12px;
    background:var(--bg-2); border:1px solid var(--line); color:var(--text-1); font-weight:700; font-size:14px;
    cursor:pointer; transition:all var(--dur) var(--ease); }
  .settings-tab:hover { color:var(--text-0); border-color:var(--line); background:var(--bg-3); }
  .settings-tab.active { color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent; box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.2); }
  .settings-tab .glyph { font-size:16px; line-height:1; }
  .settings-tab .hint { display:block; font-weight:500; font-size:11.5px; opacity:.8; margin-top:1px; }
  .settings-tab .lbl { display:flex; flex-direction:column; align-items:flex-start; }

  #panel { min-height:200px; }
</style>
</head>
<body>
  <div id="topbar"></div>
  <main class="wrap">
    <div class="page-head" id="pageHead"></div>
    <div class="tabbar" id="tabbar"></div>
    <div id="panel"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    // One settings screen per game, holding every one of its own library/session
    // screens as a tab. Which panel renders is entirely data-driven off the
    // registry (games.js `pages`), so a new game's settings screen is just an
    // entry there plus its panel modules — nothing here needs to change.
    import { el, topbar, toast } from "./platform/ui/ui.js";
    import { getGame } from "./platform/core/games.js";
    import { ready } from "./platform/core/store.js";
    await ready;

    const params = new URLSearchParams(location.search);
    const game = getGame(params.get("game"));
    const pages = game?.pages || [];

    if (!game || !pages.length) {
      document.getElementById("topbar").replaceWith(topbar({ active: "" }));
      document.getElementById("pageHead").innerHTML = "";
      document.getElementById("tabbar").style.display = "none";
      document.getElementById("panel").appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "🤷" }),
        el("div", { html: "<strong>No settings here</strong>" }),
        el("p", { text: game ? `${game.name} has nothing to configure yet.` : "That game isn't in the studio." }),
        el("a", { class: "btn primary", style: { marginTop: "12px" }, href: "home.html", text: "‹ Back to Home" }),
      ]));
    } else {
      document.body.style.setProperty("--accent", game.accent);
      document.body.style.setProperty("--accent-2", game.accent2);
      document.title = `${game.name} Settings · Game Show Studio`;

      document.getElementById("topbar").replaceWith(
        topbar({
          active: "", links: [{ href: "home.html", label: "Home" }],
          right: game.console ? [el("a", { class: "btn primary sm", href: game.console, text: "▶ Open Console" })] : [],
        })
      );

      document.getElementById("pageHead").append(
        el("div", { class: "sh-glyph", text: game.glyph }),
        el("div", {}, [
          el("h1", { text: `${game.name} Settings` }),
          el("div", { class: "sub", text: `Everything ${game.name} keeps in its library, all in one place.` }),
        ]),
        el("span", { class: "spacer" }),
      );

      /* ---- tabs ---- */
      const validKeys = new Set(pages.map((p) => p.key));
      let active = validKeys.has(params.get("tab")) ? params.get("tab") : pages[0].key;

      const tabbar = document.getElementById("tabbar");
      const tabEls = new Map();
      for (const p of pages) {
        const b = el("button", { class: "settings-tab" }, [
          el("span", { class: "glyph", text: p.glyph }),
          el("span", { class: "lbl" }, [
            el("span", { text: p.label }),
            el("small", { class: "hint", text: p.hint }),
          ]),
        ]);
        b.addEventListener("click", () => selectTab(p.key));
        tabbar.appendChild(b);
        tabEls.set(p.key, b);
      }

      /* ---- panel loading ---- */
      const panelHost = document.getElementById("panel");
      let current = null;       // {destroy, refresh} from the mounted panel
      const cache = new Map();  // page key -> resolved mount function, so re-visiting a tab is instant

      async function loadMounter(page) {
        if (cache.has(page.key)) return cache.get(page.key);
        const [file, exportName] = page.panel.split("#");
        const mod = await import(`./platform/ui/panels/${file}`);
        const fn = mod[exportName];
        if (typeof fn !== "function") throw new Error(`${page.panel} has no export "${exportName}"`);
        cache.set(page.key, fn);
        return fn;
      }

      async function selectTab(key) {
        if (key === active && current) { highlight(key); return; }
        const page = pages.find((p) => p.key === key);
        if (!page) return;
        active = key;
        highlight(key);

        const url = new URL(location.href);
        url.searchParams.set("tab", key);
        history.replaceState(null, "", url);   // shareable/refresh-safe, no history spam per click

        if (current) { current.destroy(); current = null; }
        panelHost.innerHTML = `<div class="empty"><div class="big">⏳</div></div>`;
        try {
          const mount = await loadMounter(page);
          panelHost.innerHTML = "";
          current = mount(panelHost);
        } catch (err) {
          console.error(err);
          panelHost.innerHTML = "";
          panelHost.appendChild(el("div", { class: "empty" }, [
            el("div", { class: "big", text: "⚠️" }),
            el("div", { html: "<strong>This screen didn't load</strong>" }),
            el("p", { text: String(err.message || err) }),
          ]));
        }
      }

      function highlight(key) {
        for (const [k, b] of tabEls) b.classList.toggle("active", k === key);
      }

      selectTab(active);
    }
  </script>
</body>
</html>
