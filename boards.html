<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boards · Game Show Studio</title>
<link rel="stylesheet" href="platform/ui/theme.css" />
<style>
  .page-head { display:flex; align-items:flex-end; gap:16px; margin:28px 0 20px; flex-wrap:wrap; }
  .page-head h1 { font-size:30px; }
  .page-head .sub { color:var(--text-2); font-size:14px; margin-top:4px; }
</style>
</head>
<body>
  <div id="topbar"></div>
  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>Boards</h1>
        <div class="sub">Your Jeopardy board library</div>
      </div>
    </div>
    <div id="panel"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    // The page is deliberately thin: the library itself is a panel, so this URL
    // and the game's settings screen render exactly the same component.
    import { el, topbar } from "./platform/ui/ui.js";
    import { mountBoards } from "./platform/ui/panels/boards-panel.js";

    document.getElementById("topbar").replaceWith(
      topbar({ active: "Boards", links: [
        { href: "home.html", label: "Home" },
        { href: "boards.html", label: "Boards" },
        { href: "sessions.html", label: "Sessions" },
      ], right: [
        el("a", { class: "btn primary sm", href: "index.html?screen=control", text: "▶ Open Console" }),
      ]})
    );

    mountBoards(document.getElementById("panel"));
  </script>
</body>
</html>
